<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ec" />
    <title>Finvait audio</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18304a;background:#f6f4ec;font-synthesis:none}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}
      main{width:min(100%,440px);padding:28px;border:1px solid #d9e4e3;border-radius:16px;background:#fffefa;box-shadow:0 16px 42px #18304a12}
      .brand{margin:0 0 20px;color:#39738a;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
      h1{margin:0;font-size:24px;letter-spacing:-.04em}
      p{color:#65816f;font-size:14px;line-height:1.6}
      audio{display:block;width:100%;margin-top:22px}
      #status{min-height:22px;margin:14px 0 0;font-size:13px}
      #error{color:#9b3e31}
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Finvait · Voice update</p>
      <h1>Your spoken update</h1>
      <p id="status">Preparing audio…</p>
      <audio id="player" controls preload="auto" hidden></audio>
    </main>
    <script>
      const status = document.getElementById("status");
      const player = document.getElementById("player");
      const text = new URLSearchParams(window.location.search).get("text");

      if (!text) {
        status.id = "error";
        status.textContent = "This listening link is missing its spoken message.";
      } else {
        fetch(`/api/demo/speech?text=${encodeURIComponent(text)}`)
          .then(async (response) => {
            if (!response.ok) {
              let message = `Audio could not be generated (${response.status}).`;
              try {
                const body = await response.json();
                if (body.detail) message = body.detail;
              } catch {
                // Keep the HTTP status when the server does not return JSON.
              }
              throw new Error(message);
            }
            return response.blob();
          })
          .then((audio) => {
            player.src = URL.createObjectURL(audio);
            player.hidden = false;
            status.textContent = "Audio is ready. Press play to listen.";
            player.play().catch(() => {});
          })
          .catch((error) => {
            status.id = "error";
            status.textContent = error.message || "Audio could not be generated.";
          });
      }
    </script>
  </body>
</html>
